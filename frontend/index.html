<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>CareerLens AI — AI Resume Analyzer, Job Matcher & Application Tracker</title>
    <meta name="description" content="AI Resume Analyzer, Job Matcher and Application Tracker. Evidence-preserving rewrites, transparent heuristic quality scoring, and end-to-end privacy." />

    <!-- Pre-render theme initialization script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('careerlens_theme') || 'system';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
