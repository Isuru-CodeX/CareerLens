<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerLens AI</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: #818cf8;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .job-preview {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .job-title {
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .job-company {
      color: #94a3b8;
      font-size: 11px;
    }
    .clip-btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .clip-btn:hover {
      background: #4338ca;
    }
    .clip-btn.success {
      background: #059669;
    }
    .footer-link {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
    }
    .footer-link a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
      </svg>
      <span>CareerLens AI</span>
    </div>
    <span class="status-badge" id="conn-status">Connected</span>
  </div>

  <div class="job-preview" id="preview-box">
    <div class="job-title" id="detected-title">Scanning Active Tab...</div>
    <div class="job-company" id="detected-company">Open LinkedIn or Indeed job page</div>
  </div>

  <button class="clip-btn" id="clip-action-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
    </svg>
    <span>Clip to CareerLens Pipeline</span>
  </button>

  <div class="footer-link">
    <a href="http://localhost:5173" target="_blank">Open CareerLens Kanban &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
