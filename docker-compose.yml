version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://careerlens:careerlens_secret@postgres:5432/careerlens
      - SECRET_KEY=production-grade-careerlens-compose-secret-key-2026
      - UPLOAD_DIR=/app/storage
    volumes:
      - backend-storage:/app/storage
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerlens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: careerlens-postgres
    environment:
      - POSTGRES_USER=careerlens
      - POSTGRES_PASSWORD=careerlens_secret
      - POSTGRES_DB=careerlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
  backend-storage:

